# Shared scenarios reuse one base+ER stack. Private scenarios reuse the base
# and own their ERs, with isolated identities, storage and ports.
# Base-only scenarios use the PrivateEr runner without launching an ER.
# Keep filters aligned with the catalog's topology and HostExclusive entries.
[test-groups]
private-er = { max-threads = 2 }
benchmarks = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(catalog::redline::)"
test-group = "benchmarks"

[[profile.default.overrides]]
filter = "test(api_invariants) or test(claim_fees) or test(table_mania) or test(undelegation_grpc_redundancy) or test(ephemeral_accounts) or test(aml_gate) or test(activation_single_shot) or test(program_upgrade) or test(cache_lifecycle) or test(undelegation_reconnect_gap) or test(rpc_compat_methods) or test(config_gates) or test(task_scheduler) or test(checkpoint_durability) or test(ledger_retention) or test(snapshot_read_race) or test(commit_blackout) or test(commit_exactly_once) or test(commit_settlement_order) or test(undelegation_recovery) or test(delegation_session_isolation) or test(verifier_lifecycle) or test(replication_recovery) or test(projected_token_lifecycle) or test(transaction_retry_)"
test-group = "private-er"
