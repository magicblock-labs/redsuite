# All scenario tests share one boot-once base+ER stack (the first test boots
# it, the rest reuse it — see crates/redsuite-core/src/topology/stack.rs).
# Shared-stack scenarios run in parallel.
#
# Scenarios that boot dedicated private ER validator processes are bounded
# rather than serialized: each one is a full validator process, so running them
# all at once would put roughly seven validators on the box. They no longer
# conflict on state — each takes its own identity from the genesis pool, its own
# storage directory, and its own ports.
#
# The `benchmarks` group serves two duties. redline scenarios stay alone so they
# are not measured against each other. table_mania and config_gates join them
# because redline/commit_width_envelope asserts that NO lookup-table transaction
# appears on the whole base chain during its commit window, and those two are the
# only scenarios that create lookup tables there (table_mania by subject,
# config_gates for its detector control). That assert needs an exclusive base;
# until it is scoped, mutual exclusion is the only correct arrangement.
[test-groups]
private-er = { max-threads = 2 }
benchmarks = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(redline) or test(table_mania) or test(config_gates)"
test-group = "benchmarks"

[[profile.default.overrides]]
filter = "test(aml_gate) or test(ledger_restore) or test(task_scheduler)"
test-group = "private-er"
