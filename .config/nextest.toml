# All scenario tests share one boot-once base+ER stack (the first test boots
# it, the rest reuse it — see crates/redsuite-core/src/topology/stack.rs).
# Shared-stack scenarios run in parallel.
#
# Scenarios that boot dedicated private ER validator processes are bounded
# rather than serialized: each one is a full validator process, so running them
# all at once would put roughly seven validators on the box. They no longer
# conflict on state — each takes its own identity from the genesis pool, its own
# storage directory, and its own ports.
#
# The `benchmarks` group holds the redline scenarios, one at a time, so
# performance numbers are never measured beside other work. Membership comes
# from catalog claims, not names: the `nextest_groups_match_the_catalog` unit
# test in the cli crate derives the expected group from each entry (the
# HostExclusive resource, the PrivateEr topology) and fails when these
# filters disagree with the catalog.
[test-groups]
private-er = { max-threads = 2 }
benchmarks = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(catalog::redline::)"
test-group = "benchmarks"

[[profile.default.overrides]]
filter = "test(aml_gate) or test(config_gates) or test(ledger_restore) or test(task_scheduler)"
test-group = "private-er"
