[package]
name = "redshift-program"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["schedulecommit"]
schedulecommit = ["dep:borsh", "dep:sdk", "dep:solana-sdk-ids", "dep:magic-api", "dep:bincode"]
upgraded = []
no-entrypoint = []

[dependencies]
borsh = { workspace = true, optional = true }
sdk = { workspace = true, optional = true }
solana-program = { workspace = true }
solana-sdk-ids = { version = "3", optional = true }
magic-api = { package = "magicblock-magic-program-api", version = "0.10.1", default-features = false, optional = true }
bincode = { workspace = true, optional = true }
