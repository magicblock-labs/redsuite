[workspace]
resolver = "2"
members = [
    "programs/fixture",
    "crates/redsuite-core",
    "redline",
    "redshift",
    "redhat",
    "programs/redline/interface",
    "programs/redline/program",
    "programs/redshift/interface",
    "programs/redshift/program",
    "programs/redhat/interface",
    "programs/redhat/program",
    "programs/upgrade/program",
    "xtask",
    "cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Magicblock Labs <dev@magicblock.gg>"]

[workspace.dependencies]
anyhow = "1"
fixture = { path = "programs/fixture" }
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
redsuite-core = { path = "crates/redsuite-core" }
redline = { path = "redline" }
redshift = { path = "redshift" }
redhat = { path = "redhat" }
redline-interface = { path = "programs/redline/interface" }
redline-program = { path = "programs/redline/program" }
redshift-interface = { path = "programs/redshift/interface" }
redshift-program = { path = "programs/redshift/program" }
upgrade-probe = { path = "programs/upgrade/program" }
system-interface = { package = "solana-system-interface", version = "3.2", features = ["bincode"] }
redhat-interface = { path = "programs/redhat/interface" }
redhat-program = { path = "programs/redhat/program" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "signal"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
const-str = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = { version = "2", features = ["serde"] }

serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", default-features = false, features = ["macros"] }
thiserror = "2"
derive_more = { version = "2", default-features = false, features = ["display"] }
toml = "0.8"
magicblock-config = { git = "https://github.com/magicblock-labs/magicblock-validator.git", rev = "fb23ace883d65b5c1c99a9e5b651248b2b35ac06" }
json = { package = "sonic-rs", version = "0.5" }
rand = "0.8"
base64 = "0.22"
bytes = "1"
bincode = "1.3"
wincode = { version = "0.5", features = ["derive"] }
sha2 = "0.10"
# Same dep shape as the validator's test-integration workspace (the proven pair
# against the vendored base-programs/dlp.so — see MANIFEST.toml).
sdk = { package = "ephemeral-rollups-sdk", version = "0.16.2", default-features = false, features = ["modular-sdk"] }

pubkey = { package = "solana-pubkey", version = "4.2", features = ["serde", "wincode"] }
hash = { package = "solana-hash", version = "4.3", features = ["serde", "std", "decode", "copy", "atomic", "sanitize"] }
transaction = { package = "solana-transaction", version = "4.1", features = ["serde", "wincode"] }
message = { package = "solana-message", version = "4.1", features = ["serde"] }
keypair = { package = "solana-keypair", version = "3.1" }
signature = { package = "solana-signature", version = "3.4" }
instruction = { package = "solana-instruction", version = "3.4", features = ["serde", "wincode"] }
account = { package = "solana-account", version = "4.3" }
signer = { package = "solana-signer", version = "3" }
sdk-ids = { package = "solana-sdk-ids", version = "3" }
solana-program-error = "3"
dlp-api = { package = "magicblock-delegation-program-api", version = "3.1.0", default-features = false }
magic-api = { package = "magicblock-magic-program-api", version = "0.10.1", default-features = false }
solana-rpc-client-types = { version = "4.2.2", features = ["agave-unstable-api"] }
solana-account-decoder-client-types = { version = "4.2.2", features = ["agave-unstable-api"] }
solana-transaction-status-client-types = { version = "4.2.2", features = ["agave-unstable-api"] }
solana-commitment-config = "3.1"
solana-transaction-error = "3.3"
solana-instruction-error = "2.3"
serde_json = "1"
jsonrpc-core = "18"

solana-program = "3.0"
