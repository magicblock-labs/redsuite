[workspace]
resolver = "2"
members = [
    "crates/redsuite-core",
    "redline",
    "redshift",
    "redhat",
    "programs/redline/interface",
    "programs/redline/program",
    "programs/redshift/interface",
    "programs/redshift/program",
    "programs/redhat/interface",
    "programs/redhat/program",
    "xtask",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Magicblock Labs <dev@magicblock.gg>"]

[workspace.dependencies]
redsuite-core = { path = "crates/redsuite-core" }
redline = { path = "redline" }
redshift = { path = "redshift" }
redhat = { path = "redhat" }
redline-interface = { path = "programs/redline/interface" }
redline-program = { path = "programs/redline/program" }
redshift-interface = { path = "programs/redshift/interface" }
redshift-program = { path = "programs/redshift/program" }
redhat-interface = { path = "programs/redhat/interface" }
redhat-program = { path = "programs/redhat/program" }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

serde = { version = "1", features = ["derive"] }
json = { package = "sonic-rs", version = "0.5" }
rand = "0.8"
base64 = "0.22"
bincode = "1.3"
rusqlite = { version = "0.37.0", features = ["bundled"] }
borsh = "1.5"
sha2 = "0.10"
# Same dep shape as the validator's test-integration workspace (the proven pair
# against the vendored base-programs/dlp.so — see MANIFEST.toml).
sdk = { package = "ephemeral-rollups-sdk", version = "0.16.2", default-features = false, features = ["modular-sdk"] }

pubkey = { package = "solana-pubkey", version = "3", features = ["serde"] }
hash = { package = "solana-hash", version = "3", features = ["serde"] }
transaction = { package = "solana-transaction", version = "3", features = ["bincode"] }
keypair = { package = "solana-keypair", version = "3" }
signature = { package = "solana-signature", version = "3" }
instruction = { package = "solana-instruction", version = "3" }
account = { package = "solana-account", version = "3" }
signer = { package = "solana-signer", version = "3" }
sdk-ids = { package = "solana-sdk-ids", version = "3" }

solana-program = "3.0"
