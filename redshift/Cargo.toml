[package]
name = "redshift"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
accountsdb = { package = "magicblock-accountsdb", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.24.0" }
engine-account = { package = "solana-account", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.24.0" }
ledger = { package = "magicblock-ledger", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.24.0", features = ["testkit"] }
nucleus = { package = "magicblock-engine-nucleus", git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.24.0" }
solana-rent = { version = "4.3", features = ["serde"] }
tempfile = "3"
clonetree = "0.0.2"
tar = "0.4"
zstd = "0.13"
solana-slot-hashes = { version = "3.1", features = ["serde"] }
v42-calculator-interface = { git = "https://github.com/magicblock-labs/magicblock-engine.git", tag = "0.23.1", features = ["builder"] }
anyhow.workspace = true
magic-api.workspace = true
tracing = { workspace = true }
tokio = { workspace = true, features = ["process"] }
futures-util = { workspace = true }
serde = { workspace = true }
magicblock-config = { workspace = true }
redsuite-core = { workspace = true }
url = { workspace = true }
redline-interface = { workspace = true }
redshift-interface = { workspace = true }
instruction = { workspace = true }
pubkey = { workspace = true }
hash = { workspace = true }
transaction = { workspace = true }
keypair = { workspace = true }
signature = { workspace = true }
account = { workspace = true }
signer = { workspace = true }
solana-commitment-config = { workspace = true }
solana-loader-v3-interface = { version = "6.1", features = ["bincode"] }
solana-transaction-status-client-types = { workspace = true }
sdk-ids = { workspace = true }
base64 = { workspace = true }
bincode = { workspace = true }
serde_json = { workspace = true }
solana-account-decoder-client-types = { workspace = true }
json = { workspace = true }
rand = { workspace = true }
solana-address-lookup-table-interface = { version = "3.0", features = ["bincode"] }
sdk = { workspace = true, features = ["spl", "modular-sdk"] }
solana-epoch-info = { version = "3.1", features = ["serde"] }
solana-epoch-schedule = { version = "3.2", features = ["serde"] }
solana-instruction-error = { workspace = true }
