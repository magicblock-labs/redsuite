# Provenance of the pinned third-party programs loaded into the base L1 of
# every topology. Refresh with `cargo xtask refresh-base-programs`; verify
# with `cargo xtask check-base-programs`.
#
# Keep `rev` in sync with the client-crate revs pinned by the validator under
# test (magicblock-validator Cargo.toml: magicblock-delegation-program-api /
# magic-domain-program) — the ER is compiled against those layouts.
#
# The committor program (Comtr…dABq) is deliberately NOT vendored here: it is
# part of the system-under-test artifact set and must come from the same build
# as the ER binary.

