name: Native runners

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: ''
  CARGO_INCREMENTAL: '0'

jobs:
  runner:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: redsuite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            redsuite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}-
            redsuite-${{ runner.os }}-${{ runner.arch }}-
      - id: recipe
        run: cargo xtask package metadata >> "$GITHUB_OUTPUT"
      - run: cargo build --release --locked -p redsuite
      - run: cargo xtask package runner target/release/redsuite target/runners
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ steps.recipe.outputs.platform }}
          path: target/runners/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: runner
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Attach runners
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes ""
          fi
          find assets -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) \
            -exec gh release upload "$RELEASE_TAG" --clobber {} +
